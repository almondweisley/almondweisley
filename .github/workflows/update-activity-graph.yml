name: Update Activity Graph

on:
  push:
    branches: [main]          # any push to this profile repo
  repository_dispatch:
    types: [push]             # optional: instant ping from other repos
  schedule:
    - cron: "*/5 * * * *"     # every 5 min (GitHub's minimum) to catch pushes to your other repos
  workflow_dispatch:

concurrency:
  group: activity-graph
  cancel-in-progress: false

jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate activity graph
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const login = context.repo.owner;
            const to = new Date();
            const from = new Date(to.getTime() - 30 * 864e5);
            const q = `query($login:String!,$from:DateTime!,$to:DateTime!){
              user(login:$login){ contributionsCollection(from:$from,to:$to){
                contributionCalendar{ weeks{ contributionDays{ date contributionCount } } } } } }`;
            const r = await github.graphql(q, { login, from: from.toISOString(), to: to.toISOString() });
            const days = r.user.contributionsCollection.contributionCalendar.weeks
              .flatMap(w => w.contributionDays).slice(-31);
            const W = 1200, H = 420, L = 70, R = 30, T = 70, B = 70;
            const GREEN = '#39d353';
            const max = Math.ceil(Math.max(4, ...days.map(d => d.contributionCount)) / 4) * 4;
            const f1 = n => Math.round(n * 10) / 10;
            const x = i => f1(L + i * (W - L - R) / (days.length - 1));
            const y = v => f1(H - B - v * (H - T - B) / max);
            const pts = days.map((d, i) => [x(i), y(d.contributionCount)]);
            // Monotone cubic (Fritsch-Carlson): smooth curve through every point, never overshoots below 0
            const smooth = p => {
              const n = p.length, dx = [], s = [], m = [];
              for (let i = 0; i < n - 1; i++) { dx[i] = p[i + 1][0] - p[i][0]; s[i] = (p[i + 1][1] - p[i][1]) / dx[i]; }
              m[0] = s[0]; m[n - 1] = s[n - 2];
              for (let i = 1; i < n - 1; i++) m[i] = s[i - 1] * s[i] <= 0 ? 0 : (s[i - 1] + s[i]) / 2;
              for (let i = 0; i < n - 1; i++) {
                if (s[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
                const a = m[i] / s[i], b = m[i + 1] / s[i], h = a * a + b * b;
                if (h > 9) { const t = 3 / Math.sqrt(h); m[i] = t * a * s[i]; m[i + 1] = t * b * s[i]; }
              }
              let d = `M${p[0][0]},${p[0][1]}`;
              for (let i = 0; i < n - 1; i++) {
                const h = dx[i] / 3;
                d += ` C${f1(p[i][0] + h)},${f1(p[i][1] + m[i] * h)} ${f1(p[i + 1][0] - h)},${f1(p[i + 1][1] - m[i + 1] * h)} ${p[i + 1][0]},${p[i + 1][1]}`;
              }
              return d;
            };
            const line = smooth(pts);
            const area = `${line} L${x(days.length - 1)},${H - B} L${L},${H - B} Z`;
            const grid = [0, 0.25, 0.5, 0.75, 1].map(f => {
              const v = Math.round(max * f), yy = y(max * f);
              return `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#ffffff" stroke-opacity="0.08"/>` +
                `<text x="${L - 12}" y="${yy + 4}" text-anchor="end">${v}</text>`;
            }).join('');
            const labels = days.map((d, i) => i % 3 ? '' :
              `<text x="${x(i)}" y="${H - B + 24}" text-anchor="middle">${+d.date.slice(8)}</text>`).join('');
            const dots = pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${GREEN}" stroke="#20232a" stroke-width="2"/>`).join('');
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
            <defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${GREEN}" stop-opacity="0.35"/><stop offset="1" stop-color="${GREEN}" stop-opacity="0"/></linearGradient></defs>
            <rect width="100%" height="100%" rx="6" fill="#20232a"/>
            <text x="${W / 2}" y="40" text-anchor="middle" fill="${GREEN}" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="600">${login}'s Contribution Graph</text>
            <g fill="#8b949e" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12">${grid}${labels}
            <text x="${W / 2}" y="${H - 18}" text-anchor="middle" font-size="13">Days</text>
            <text transform="translate(22 ${H / 2}) rotate(-90)" text-anchor="middle" font-size="13">Contributions</text></g>
            <path d="${area}" fill="url(#fill)"/>
            <path d="${line}" fill="none" stroke="${GREEN}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}
            </svg>`;
            fs.writeFileSync('profile/activity-graph.svg', svg);

      - name: Commit and push graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/activity-graph.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update activity graph [skip ci]"
          git pull --rebase origin main
          git push
